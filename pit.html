<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="theme-color" content="#0c0d10" />
<title>Pit Board · 100-Mile Race</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0c0d10;
    --bg-elevated: #14161b;
    --bg-card: #1a1d24;
    --border: #262932;
    --border-bright: #353946;
    --text: #e8e6e1;
    --text-dim: #8a8a8a;
    --text-muted: #5a5a60;
    --accent: #ff6b3d;
    --accent-glow: rgba(255, 107, 61, 0.18);
    --green: #6ee7a8;
    --green-glow: rgba(110, 231, 168, 0.18);
    --yellow: #f5c451;
    --red: #ff5959;
    --blue: #5ec8ff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }
  body { padding: 20px 16px 32px; }

  header {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 20px; padding-bottom: 16px;
    border-bottom: 1px solid var(--border);
  }
  .brand { display: flex; flex-direction: column; gap: 4px; }
  .brand-meta {
    display: flex; gap: 10px; align-items: center;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px; text-transform: uppercase; letter-spacing: 0.18em;
    color: var(--text-muted);
  }
  h1 {
    font-family: 'Fraunces', serif; font-weight: 800;
    font-size: 28px; line-height: 1; letter-spacing: -0.025em;
  }
  h1 em { font-style: italic; color: var(--accent); font-weight: 600; }
  a.nav-link {
    font-family: 'JetBrains Mono', monospace; font-size: 11px;
    letter-spacing: 0.15em; text-transform: uppercase;
    color: var(--text-dim); text-decoration: none;
    border: 1px solid var(--border); padding: 8px 12px; border-radius: 4px;
  }
  a.nav-link:hover, a.nav-link:active { color: var(--text); border-color: var(--border-bright); }

  #runners {
    display: grid; grid-template-columns: 1fr 1fr; gap: 16px;
    margin-bottom: 24px;
  }
  @media (max-width: 760px) { #runners { grid-template-columns: 1fr; } }

  .runner {
    background: var(--bg-card); border: 1px solid var(--border);
    border-radius: 6px; overflow: hidden; position: relative;
    transition: border-color 0.3s ease;
  }
  .runner.course { border-color: rgba(255, 107, 61, 0.5); }
  .runner.pit { border-color: rgba(110, 231, 168, 0.4); }
  .runner::before {
    content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px;
    background: var(--border);
    transition: background 0.3s ease;
  }
  .runner.course::before { background: linear-gradient(90deg, var(--accent), transparent); }
  .runner.pit::before { background: linear-gradient(90deg, var(--green), transparent); }

  .runner-head {
    padding: 18px 20px 14px; display: flex;
    justify-content: space-between; align-items: center; gap: 12px;
    border-bottom: 1px solid var(--border);
  }
  .runner-name {
    font-family: 'Fraunces', serif; font-size: 26px;
    font-weight: 600; letter-spacing: -0.02em;
  }
  .state-badge {
    font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 700;
    letter-spacing: 0.2em; text-transform: uppercase;
    padding: 6px 10px; border-radius: 2px; border: 1px solid currentColor;
  }
  .state-course { color: var(--accent); }
  .state-pit { color: var(--green); }
  .state-idle { color: var(--text-muted); }

  .state-timer {
    padding: 14px 20px; display: flex; justify-content: space-between;
    align-items: baseline; border-bottom: 1px solid var(--border);
    background: var(--bg-elevated);
  }
  .state-timer .label {
    font-family: 'JetBrains Mono', monospace; font-size: 9px;
    text-transform: uppercase; letter-spacing: 0.2em; color: var(--text-muted);
  }
  .state-timer .value {
    font-family: 'JetBrains Mono', monospace; font-size: 22px;
    font-weight: 700; letter-spacing: -0.02em;
  }
  .runner.course .state-timer .value { color: var(--accent); }
  .runner.pit .state-timer .value { color: var(--green); }

  .big-btn {
    display: block; width: 100%;
    padding: 28px 16px;
    background: var(--bg-elevated);
    color: var(--text); border: none; border-bottom: 1px solid var(--border);
    font-family: 'JetBrains Mono', monospace;
    font-size: 18px; font-weight: 700;
    letter-spacing: 0.05em; text-transform: uppercase;
    cursor: pointer; user-select: none;
    transition: background 0.15s ease, transform 0.05s ease;
  }
  .big-btn:hover { background: #1f222a; }
  .big-btn:active { transform: scale(0.98); background: #2a2e38; }
  .big-btn.out {
    background: linear-gradient(180deg, rgba(255, 107, 61, 0.18), rgba(255, 107, 61, 0.06));
    color: var(--accent); border-top: 1px solid rgba(255, 107, 61, 0.3);
  }
  .big-btn.out:hover { background: linear-gradient(180deg, rgba(255, 107, 61, 0.28), rgba(255, 107, 61, 0.12)); }
  .big-btn.in {
    background: linear-gradient(180deg, rgba(110, 231, 168, 0.18), rgba(110, 231, 168, 0.06));
    color: var(--green); border-top: 1px solid rgba(110, 231, 168, 0.3);
  }
  .big-btn.in:hover { background: linear-gradient(180deg, rgba(110, 231, 168, 0.28), rgba(110, 231, 168, 0.12)); }

  .event-list { padding: 12px 20px 18px; }
  .event-list-title {
    font-family: 'JetBrains Mono', monospace; font-size: 9px;
    letter-spacing: 0.2em; text-transform: uppercase;
    color: var(--text-muted); margin-bottom: 10px;
  }
  .event {
    display: grid; grid-template-columns: 1fr auto auto;
    gap: 10px; align-items: center;
    padding: 8px 0; border-bottom: 1px solid var(--border);
    font-family: 'JetBrains Mono', monospace; font-size: 12px;
  }
  .event:last-child { border-bottom: none; }
  .event.sent { opacity: 0.45; }
  .event-action.out { color: var(--accent); }
  .event-action.in { color: var(--green); }
  .event-time {
    color: var(--text-dim); cursor: pointer;
    padding: 4px 6px; border-radius: 3px;
    border: 1px solid transparent;
  }
  .event-time:hover { color: var(--text); border-color: var(--border-bright); }
  .event-del {
    background: transparent; border: 1px solid var(--border);
    color: var(--text-muted); cursor: pointer;
    width: 26px; height: 26px; border-radius: 3px;
    font-size: 14px; line-height: 1;
  }
  .event-del:hover { color: var(--red); border-color: var(--red); }
  .empty {
    color: var(--text-muted); font-style: italic;
    font-size: 12px; padding: 8px 0;
    font-family: 'Inter', sans-serif;
  }

  .unsent {
    background: var(--bg-card); border: 1px solid var(--border);
    border-radius: 6px; padding: 18px 20px;
  }
  .unsent-head {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 12px; flex-wrap: wrap; gap: 10px;
  }
  .unsent-title {
    font-family: 'JetBrains Mono', monospace; font-size: 11px;
    letter-spacing: 0.2em; text-transform: uppercase; color: var(--text-muted);
  }
  .unsent-actions { display: flex; gap: 8px; }
  .ctrl-btn {
    font-family: 'JetBrains Mono', monospace; font-size: 11px;
    letter-spacing: 0.1em; text-transform: uppercase; font-weight: 600;
    padding: 10px 14px; border-radius: 4px; cursor: pointer;
    background: var(--bg-elevated); color: var(--text);
    border: 1px solid var(--border-bright);
  }
  .ctrl-btn:hover:not(:disabled) { background: #22262e; }
  .ctrl-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .ctrl-btn.primary { background: var(--accent); color: #1a0a04; border-color: var(--accent); }
  .ctrl-btn.primary:hover:not(:disabled) { background: #ff7d54; }
  pre#unsent-text {
    background: var(--bg-elevated); border: 1px solid var(--border);
    border-radius: 4px; padding: 14px;
    font-family: 'JetBrains Mono', monospace; font-size: 13px;
    color: var(--text-dim); white-space: pre-wrap; word-break: break-word;
    max-height: 200px; overflow-y: auto;
  }

  footer {
    margin-top: 24px;
    font-family: 'JetBrains Mono', monospace; font-size: 10px;
    letter-spacing: 0.15em; text-transform: uppercase; color: var(--text-muted);
    text-align: center;
  }
</style>
</head>
<body>

<header>
  <div class="brand">
    <div class="brand-meta">
      <span>Pit Board</span><span>· Crew Chief</span>
    </div>
    <h1>Sign <em>In/Out</em></h1>
  </div>
  <a class="nav-link" href="index.html">Dashboard →</a>
</header>

<section id="runners"></section>

<section class="unsent">
  <div class="unsent-head">
    <span class="unsent-title">Unsent · Copy + paste to Claude</span>
    <div class="unsent-actions">
      <button id="copy-all" class="ctrl-btn primary">Copy</button>
      <button id="mark-sent" class="ctrl-btn">Mark all sent</button>
    </div>
  </div>
  <pre id="unsent-text">(no unsent events)</pre>
</section>

<footer>Times stored on this device only · clear button: <a href="#" id="reset" style="color: var(--text-muted); text-decoration: underline;">reset all</a></footer>

<script>
  const RUNNERS = [
    { id: 'jasmine', name: 'Jasmine' },
    { id: 'oppenheimer', name: 'Oppenheimer' }
  ];
  const STORAGE_KEY = 'pit-board-events-v1';

  function loadStore() {
    try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}; }
    catch (e) { return {}; }
  }
  function saveStore(s) { localStorage.setItem(STORAGE_KEY, JSON.stringify(s)); }

  function getRunnerEvents(id) {
    const store = loadStore();
    return (store[id] && store[id].events) || [];
  }

  function getRunnerState(id) {
    const events = getRunnerEvents(id);
    if (events.length === 0) return { events: [], lastAction: null, currentLap: 0, lastTs: null };
    const last = events[events.length - 1];
    const outCount = events.filter(e => e.action === 'out').length;
    return { events, lastAction: last.action, currentLap: outCount, lastTs: last.ts };
  }

  function press(runnerId, action) {
    const store = loadStore();
    if (!store[runnerId]) store[runnerId] = { events: [] };
    const events = store[runnerId].events;
    const outCount = events.filter(e => e.action === 'out').length;
    const lap = action === 'out' ? outCount + 1 : outCount;
    const now = new Date();
    events.push({
      id: now.getTime() + '-' + Math.random().toString(36).slice(2, 6),
      ts: now.toISOString(),
      action, lap, sent: false
    });
    saveStore(store);
    render();
  }

  function deleteEvent(runnerId, eventId) {
    if (!confirm('Delete this event?')) return;
    const store = loadStore();
    if (!store[runnerId]) return;
    store[runnerId].events = store[runnerId].events.filter(e => e.id !== eventId);
    saveStore(store);
    render();
  }

  function editEventTime(runnerId, eventId) {
    const store = loadStore();
    const event = (store[runnerId]?.events || []).find(e => e.id === eventId);
    if (!event) return;
    const cur = new Date(event.ts);
    const pad = n => String(n).padStart(2, '0');
    const input = prompt(
      'Edit time (24h, HH:MM or HH:MM:SS):',
      `${pad(cur.getHours())}:${pad(cur.getMinutes())}:${pad(cur.getSeconds())}`
    );
    if (!input) return;
    const m = input.trim().match(/^(\d{1,2}):(\d{2})(?::(\d{2}))?$/);
    if (!m) { alert('Bad format. Use HH:MM or HH:MM:SS.'); return; }
    const next = new Date(cur);
    next.setHours(+m[1], +m[2], +(m[3] || 0), 0);
    event.ts = next.toISOString();
    saveStore(store);
    render();
  }

  function markAllSent() {
    const store = loadStore();
    for (const r of RUNNERS) {
      if (store[r.id]) store[r.id].events.forEach(e => e.sent = true);
    }
    saveStore(store);
    render();
  }

  function resetAll() {
    if (!confirm('Erase ALL recorded pit events on this device? This cannot be undone.')) return;
    localStorage.removeItem(STORAGE_KEY);
    render();
  }

  function fmtClock(iso) {
    return new Date(iso).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit', second: '2-digit' });
  }

  function fmtElapsed(seconds) {
    if (seconds < 0 || isNaN(seconds)) return '—';
    const h = Math.floor(seconds / 3600);
    const m = Math.floor((seconds % 3600) / 60);
    const s = Math.floor(seconds % 60);
    const pad = n => String(n).padStart(2, '0');
    if (h) return `${h}:${pad(m)}:${pad(s)}`;
    return `${pad(m)}:${pad(s)}`;
  }

  function eventMessage(runnerName, ev) {
    const time = fmtClock(ev.ts);
    if (ev.action === 'out') return `${runnerName} signed out for lap ${ev.lap} at ${time}`;
    return `${runnerName} signed in (lap ${ev.lap} done) at ${time}`;
  }

  function getUnsentText() {
    const store = loadStore();
    const all = [];
    for (const r of RUNNERS) {
      const events = ((store[r.id] || {}).events || []).filter(e => !e.sent);
      for (const e of events) all.push({ name: r.name, ev: e });
    }
    all.sort((a, b) => new Date(a.ev.ts) - new Date(b.ev.ts));
    return all.map(x => eventMessage(x.name, x.ev)).join('\n');
  }

  function renderRunner(runner) {
    const s = getRunnerState(runner.id);
    const onCourse = s.lastAction === 'out';
    const inPit = s.lastAction === 'in';
    const stateLabel = onCourse ? 'On Course' : (inPit ? 'In Pit' : 'Not Started');
    const stateClass = onCourse ? 'course' : (inPit ? 'pit' : 'idle');

    let buttonLabel, buttonAction;
    if (onCourse) {
      buttonLabel = `Sign In · End Lap ${s.currentLap}`;
      buttonAction = 'in';
    } else {
      const nextLap = (inPit ? s.currentLap : 0) + 1;
      buttonLabel = `Sign Out · Start Lap ${nextLap}`;
      buttonAction = 'out';
    }

    const recent = s.events.slice(-6).reverse();
    const recentHtml = recent.length === 0
      ? '<div class="empty">No events yet</div>'
      : recent.map(e => `
          <div class="event ${e.sent ? 'sent' : ''}">
            <span class="event-action ${e.action}">${e.action === 'out' ? '→ Out, lap ' + e.lap : '← In, lap ' + e.lap}${e.sent ? ' · sent' : ''}</span>
            <span class="event-time" data-action="edit" data-runner="${runner.id}" data-event="${e.id}">${fmtClock(e.ts)}</span>
            <button class="event-del" data-action="del" data-runner="${runner.id}" data-event="${e.id}" aria-label="Delete">×</button>
          </div>
        `).join('');

    return `
      <article class="runner ${stateClass}">
        <div class="runner-head">
          <div class="runner-name">${runner.name}</div>
          <div class="state-badge state-${stateClass}">${stateLabel}</div>
        </div>
        <div class="state-timer" data-since="${s.lastTs || ''}">
          <span class="label">${onCourse ? 'On course for' : (inPit ? 'In pit for' : 'Time in current state')}</span>
          <span class="value runner-timer">—</span>
        </div>
        <button class="big-btn ${buttonAction}" data-action="press" data-runner="${runner.id}" data-press="${buttonAction}">
          ${buttonLabel}
        </button>
        <div class="event-list">
          <div class="event-list-title">Recent (tap time to edit, × to delete)</div>
          ${recentHtml}
        </div>
      </article>
    `;
  }

  function render() {
    document.getElementById('runners').innerHTML = RUNNERS.map(renderRunner).join('');
    const unsent = getUnsentText();
    document.getElementById('unsent-text').textContent = unsent || '(no unsent events)';
    document.getElementById('copy-all').disabled = !unsent;
    document.getElementById('mark-sent').disabled = !unsent;
    tick();
  }

  function tick() {
    document.querySelectorAll('.runner').forEach(card => {
      const timerEl = card.querySelector('.state-timer');
      const valueEl = card.querySelector('.runner-timer');
      const since = timerEl?.dataset.since;
      if (!since) { if (valueEl) valueEl.textContent = '—'; return; }
      const seconds = (Date.now() - new Date(since).getTime()) / 1000;
      if (valueEl) valueEl.textContent = fmtElapsed(seconds);
    });
  }

  async function copyAll() {
    const text = getUnsentText();
    if (!text) return;
    const btn = document.getElementById('copy-all');
    const orig = btn.textContent;
    try {
      await navigator.clipboard.writeText(text);
      btn.textContent = 'Copied ✓';
    } catch (e) {
      const ta = document.createElement('textarea');
      ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy'); btn.textContent = 'Copied ✓'; }
      catch (_) { btn.textContent = 'Copy failed'; }
      document.body.removeChild(ta);
    }
    setTimeout(() => { btn.textContent = orig; }, 1500);
  }

  document.body.addEventListener('click', (e) => {
    const t = e.target.closest('[data-action]');
    if (!t) return;
    const action = t.dataset.action;
    if (action === 'press') press(t.dataset.runner, t.dataset.press);
    else if (action === 'edit') editEventTime(t.dataset.runner, t.dataset.event);
    else if (action === 'del') deleteEvent(t.dataset.runner, t.dataset.event);
  });

  document.getElementById('copy-all').addEventListener('click', copyAll);
  document.getElementById('mark-sent').addEventListener('click', () => {
    if (confirm('Mark all events as sent? They\'ll be hidden from the unsent list.')) markAllSent();
  });
  document.getElementById('reset').addEventListener('click', (e) => {
    e.preventDefault(); resetAll();
  });

  render();
  setInterval(tick, 1000);
</script>

</body>
</html>
